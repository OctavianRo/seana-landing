<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>seána — Business portal</title>
  <style>
    :root{--bg:#0f1114;--card:#191c21;--line:#2b3038;--text:#f4f0e9;--muted:#a9aaa8;--accent:#d18a69;--green:#83c792;--yellow:#e9be63;--red:#eb8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.centre{display:grid;place-items:center;min-height:100vh;padding:24px}.card,.panel,.metric{background:var(--card);border:1px solid var(--line);border-radius:14px}.card{max-width:480px;width:100%;padding:28px}.logo{font-weight:800;font-size:25px;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:13px}header{height:auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.location-picker{width:min(330px,75vw)}input,select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#111318;color:var(--text)}button{border:0;border-radius:9px;padding:10px 13px;font-weight:750;background:var(--accent);color:#21140e;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}button:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:1180px;margin:auto;padding:24px}h1{font-size:26px;line-height:1.2;margin:0 0 5px}h2{font-size:17px;margin:0 0 14px}.intro{margin:22px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric{padding:17px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.value{font-size:25px;font-weight:800;margin-top:3px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:13px;margin-top:13px}.panel{padding:18px}.booking{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.booking:first-of-type{border-top:0;padding-top:0}.name{font-weight:700}.meta{font-size:13px;color:var(--muted)}.status{font-size:12px;font-weight:750;text-transform:capitalize;text-align:right}.confirmed{color:var(--green)}.pending{color:var(--yellow)}.cancelled{color:var(--red)}.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.list li:first-child{padding-top:0;border-top:0}.empty{color:var(--muted);text-align:center;padding:26px}.notice{padding:13px 15px;border-radius:11px;border:1px solid rgba(209,138,105,.45);background:rgba(209,138,105,.09);margin:0 0 16px}.notice.error{border-color:rgba(235,133,133,.6);background:rgba(235,133,133,.1)}dialog{border:0;background:transparent;padding:20px;width:min(520px,100%)}dialog::backdrop{background:rgba(0,0,0,.7)}.form{padding:22px}.form-grid{display:grid;gap:12px;margin:16px 0}.form-actions{display:flex;justify-content:flex-end;gap:10px}.error-text{color:var(--red);min-height:22px}@media(max-width:760px){header{padding:12px}.shell{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.location-picker{width:100%}}
  </style>
<link rel="icon" type="image/png" sizes="128x128" href="/portal/favicon.png?v=3"><link rel="icon" type="image/svg+xml" href="/portal/favicon.svg?v=3"></head>
<body>
  <main id="loading" class="centre"><p class="muted">Loading your workspace…</p></main>
  <main id="signin" class="centre hidden"><section class="card"><div class="logo">seána</div><h1 style="margin-top:20px">Business portal</h1><p class="muted">Bookings, branches, and demand insights in one secure place.</p><div id="clerk-signin" style="margin-top:20px"></div></section></main>
  <main id="portal" class="hidden"><header><div class="logo">seána <span class="muted small">business</span></div><div class="actions"><select id="location-picker" class="location-picker" aria-label="Choose location"></select><a href="/portal/onboard.html#setup" style="color:inherit">Setup checklist</a><button id="add-location" class="secondary" type="button">Add location</button><button id="signout" class="secondary" type="button">Sign out</button></div></header><div class="shell"><section class="intro"><h1 id="location-name">Your dashboard</h1><p id="location-meta" class="muted"></p></section><div id="message"></div><div id="dashboard"></div></div></main>
  <script src="/portal/clerk-loader.js"></script>
  <script>
    const API_URL = /(^localhost$|^127\.|railway\.app$)/.test(location.hostname) ? '' : 'https://saunaapp-production.up.railway.app';
    let clerk, locations=[], active, dashboardVersion=0, workspaceVersion=0, observedSession, features={};
    const $=id=>document.getElementById(id), set=(el,v)=>el.textContent=String(v??'');
    const show=id=>['loading','signin','portal'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
    const euro=cents=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format((Number(cents)||0)/100);
    async function api(path,options={}){const token=await clerk.session?.getToken();const res=await fetch(`${API_URL}${path}`,{...options,signal:AbortSignal.timeout(15000),headers:{...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(token?{Authorization:`Bearer ${token}`}:{}),...(options.headers||{})}});let body=null;try{body=await res.json()}catch{}return{ok:res.ok,status:res.status,body};}
    function notice(message,error=false){const root=$('message');root.replaceChildren();if(!message)return;const p=document.createElement('p');p.className=`notice${error?' error':''}`;set(p,message);root.append(p);}
    async function sessionChanged(session){
      ++workspaceVersion;++dashboardVersion;locations=[];active=null;$('dashboard').replaceChildren();notice('');
      if(!session||session.status!=='active'){show('signin');clerk.mountSignIn($('clerk-signin'),{forceRedirectUrl:location.origin+location.pathname});return;}
      await loadWorkspace();
    }
    async function boot(){try{
      const response=await fetch(`${API_URL}/api/public-config`,{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('Owner service is temporarily unavailable.');features=await response.json();
      if(!features.clerkPublishableKey)throw new Error('Secure sign-in is not configured.');clerk=await window.SeanaAuth.load(features.clerkPublishableKey);
      const changed=({session})=>{const key=session?session.id+':'+session.status:'signed-out';if(key===observedSession)return;observedSession=key;sessionChanged(session).catch(()=>{show('portal');notice('Could not load your workspace. Reload to try again.',true);});};
      clerk.addListener(changed);changed({session:clerk.session});
    }catch(error){show('signin');const p=document.createElement('p');p.className='notice error';set(p,error.message||'The portal could not load.');$('clerk-signin').replaceChildren(p);}}
    async function loadWorkspace(preferred){
      const version=++workspaceVersion;++dashboardVersion;show('portal');$('dashboard').replaceChildren();
      try{const response=await api('/api/business/me');if(version!==workspaceVersion)return;
      if(!response.ok)throw new Error(response.body?.error||'We could not verify your business access.');
      locations=(response.body.locations||[]).filter(l=>l.verified&&l.verifiedVia!=='legacy_migration');
      if(!locations.length){renderEmpty(response.body);return;}
      active=locations.find(l=>l.saunaId===preferred)||locations.find(l=>l.saunaId===active?.saunaId)||locations[0];renderPicker();await loadDashboard();
      }catch(error){if(version===workspaceVersion)notice(error.message||'Could not load your workspace. Reload to try again.',true);}
    }
    function renderPicker(){const picker=$('location-picker');picker.replaceChildren();for(const location of locations){const option=document.createElement('option');option.value=location.saunaId;option.selected=location.saunaId===active.saunaId;set(option,`${location.name}${location.county?` — ${location.county}`:''}`);picker.append(option);}const owner=locations.some(l=>l.canManageMembers);$('add-location').classList.toggle('hidden',!owner);}
    function renderEmpty(state){$('location-picker').replaceChildren();$('add-location').classList.remove('hidden');set($('location-name'),'Set up your business');set($('location-meta'),state.pendingClaims?.length?'Your ownership claim is under review.':'Open the setup checklist to add a location or request ownership review.');const root=$('dashboard');root.replaceChildren();const panel=document.createElement('section');panel.className='panel';const h=document.createElement('h2');set(h,'No live locations yet');const p=document.createElement('p');p.className='muted';set(p,'After verification, booking calendars and analytics will appear here.');panel.append(h,p);root.append(panel);}
    async function loadDashboard(){
      const version=++dashboardVersion, location=active;
      notice('');set($('location-name'),location.name);set($('location-meta'),[location.county,location.role,location.verified?'Verified':'Awaiting verification'].filter(Boolean).join(' · '));
      const root=$('dashboard');root.replaceChildren();set(root,'Loading location…');
      try {
        const id=encodeURIComponent(location.saunaId);
        const [bookings,profile,analytics,listing]=await Promise.all([api(`/api/business/${id}/bookings`),api(`/api/business/${id}/profile`),api(`/api/business/${id}/analytics`),api(`/api/business/${id}/listing`)]);
        if(version!==dashboardVersion)return;
        if(!bookings.ok)throw new Error(bookings.body?.error||'Could not load this location.');
        renderDashboard(bookings.body,analytics.body,analytics.ok);
        if(profile.ok && listing.ok)root.append(editorPanel(location,listing.body,profile.body));
        else notice('Location editing is temporarily unavailable. Please refresh.',true);
      }catch(error){if(version!==dashboardVersion)return;root.replaceChildren();notice(error.message||'Could not load this location.',true);}
    }
    function editorPanel(location,listing,profile){
      const panel=document.createElement('section');panel.className='panel';panel.style.marginTop='16px';
      const title=document.createElement('h2');set(title,'Manage location');panel.append(title);
      const state=document.createElement('p');state.className='muted';set(state,`Listing: ${profile.listingStatus} · Online payments: ${profile.stripeConnected?'ready':'not connected'}`);panel.append(state);
      if(features.paymentsEnabled===false){const note=document.createElement('p');set(note,'Online payments are not enabled yet.');panel.append(note);}else if(!profile.stripeConnected){const note=document.createElement('p');set(note,'Connect your Stripe account in the seána business app before accepting online bookings.');panel.append(note);}
      const form=document.createElement('form');form.className='form-grid';
      for(const [key,label,type,max] of [['name','Location name','text',160],['location','Address','text',300],['county','County','text',80],['lat','Latitude (map pin)','number',90],['lng','Longitude (map pin)','number',180],['website','Website','url',2000],['phone','Phone','text',50],['description','Description','text',5000],['opening_hours','Opening hours','text',2000],['sauna_rules','Sauna rules','text',10000],['terms_conditions','Booking and cancellation terms','text',20000],['session_price','Session price (€)','number',10000],['max_capacity','People per slot','number',500]]){
        const wrapper=document.createElement('label'),input=document.createElement('input');set(wrapper,label);input.name=key;input.type=type;input.value=listing[key]??'';
        if(type==='number'){input.min=key==='lat'?'-90':key==='lng'?'-180':key==='max_capacity'?'1':'0.5';input.max=String(max);input.step=key==='max_capacity'?'1':key==='lat'||key==='lng'?'any':'0.01';input.required=key==='session_price'||key==='max_capacity';}else input.maxLength=max;
        if(key==='name')input.required=true;input.disabled=!profile.canWrite||!profile.ownershipVerified;wrapper.append(input);form.append(wrapper);
      }
      const facilities=document.createElement('fieldset');const legend=document.createElement('legend');set(legend,'Facilities');facilities.append(legend);
      for(const key of new Set(['plunge_pool','steam_room','private_booking','coffee_food','pool','outdoor','indoor','river_setting','showers','changing_rooms','toilets','parking','wheelchair_access',...(listing.amenities||[])])){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='amenities';input.value=key;input.checked=(listing.amenities||[]).includes(key);input.disabled=!profile.canWrite||!profile.ownershipVerified;label.append(input,document.createTextNode(key.replaceAll('_',' ')));facilities.append(label);}form.append(facilities);
      const feedback=document.createElement('p');feedback.setAttribute('role','status');
      const save=document.createElement('button');save.type='submit';set(save,'Save location');save.disabled=!profile.canWrite||!profile.ownershipVerified;
      form.append(feedback,save);form.addEventListener('submit',async e=>{e.preventDefault();save.disabled=true;set(feedback,'Saving…');
        try{const body=Object.fromEntries(new FormData(form));body.amenities=new FormData(form).getAll('amenities');body.session_price=Number(body.session_price);body.max_capacity=Number(body.max_capacity);for(const key of ['lat','lng']){if(body[key]==='')delete body[key];else body[key]=Number(body[key]);}
          const result=await api(`/api/business/${encodeURIComponent(location.saunaId)}/listing`,{method:'PUT',body:JSON.stringify(body)});
          if(!result.ok)throw new Error(result.body?.error||'Could not save location');set(feedback,'Saved. Your location details are up to date.');
          location.name=body.name;if(active?.saunaId===location.saunaId){set($('location-name'),body.name);renderPicker();}
        }catch(error){set(feedback,error.message||'Could not save location.')}finally{save.disabled=false;}});
      panel.append(form);
      const photos=document.createElement('section'),heading=document.createElement('h3'),photoStatus=document.createElement('p');set(heading,'Photos');photoStatus.setAttribute('role','status');photos.append(heading,photoStatus);
      if(features.photoUploadsEnabled===false){set(photoStatus,'Photo changes are not enabled yet. Your current photos are unchanged.');panel.append(photos);return panel;}
      let photoBusy=false;
      async function updatePhoto(path,options){if(photoBusy)return;photoBusy=true;for(const el of photos.querySelectorAll('button,input'))el.disabled=true;try{const response=await api(path,options);if(!response.ok)throw new Error(response.body?.error||'Could not update photo');if(active?.saunaId===location.saunaId)await loadDashboard();}catch(error){set(photoStatus,error.message);for(const el of photos.querySelectorAll('button,input'))el.disabled=!profile.canWrite||!profile.ownershipVerified;}finally{photoBusy=false;}}
      for(const photo of listing.photos||[]){const image=document.createElement('img');image.src=new URL(photo.url,API_URL||window.location.origin).href;image.alt='Sauna location photo';image.style.cssText='width:100%;max-width:320px;max-height:220px;object-fit:cover;border-radius:12px';const remove=document.createElement('button');remove.type='button';set(remove,'Remove photo');remove.disabled=!profile.canWrite||!profile.ownershipVerified;remove.onclick=()=>{if(confirm('Remove this photo from your public sauna profile?'))void updatePhoto(`/api/business/${encodeURIComponent(location.saunaId)}/upload-photo`,{method:'DELETE',body:JSON.stringify({photoUrl:photo.url})});};photos.append(image,remove);}
      const upload=document.createElement('input');upload.type='file';upload.accept='image/jpeg,image/png,image/webp';upload.setAttribute('aria-label','Add a sauna photo');upload.disabled=!profile.canWrite||!profile.ownershipVerified||(listing.photos||[]).length>=5;
      upload.onchange=()=>{const file=upload.files?.[0];if(!file)return;if(file.size>5*1024*1024){set(photoStatus,'Choose a photo smaller than 5 MB.');upload.value='';return;}const body=new FormData();body.append('photo',file);void updatePhoto(`/api/business/${encodeURIComponent(location.saunaId)}/upload-photo`,{method:'POST',body});};
      const help=document.createElement('p');set(help,'Up to 5 JPEG, PNG or WebP images, 5 MB each. Add a replacement before removing an old photo.');photos.append(help,upload);panel.append(photos);return panel;
    }
    function metric(label,value){const card=document.createElement('section');card.className='metric';const l=document.createElement('div');l.className='label';set(l,label);const v=document.createElement('div');v.className='value';set(v,value);card.append(l,v);return card;}
    function renderDashboard(bookings,analytics,analyticsOk){const root=$('dashboard');root.replaceChildren();const today=bookings.today||[],upcoming=bookings.upcoming||[],confirmed=upcoming.filter(b=>b.status==='confirmed').length;const grid=document.createElement('div');grid.className='grid';grid.append(metric('Today',today.length),metric('Upcoming',upcoming.length),metric('Confirmed',confirmed),metric('Capacity',bookings.capacity?`${bookings.capacity} per slot`:'—'));const two=document.createElement('div');two.className='two';two.append(bookingsPanel(upcoming),analyticsPanel(analytics,analyticsOk));root.append(grid,two);if(features.paymentsEnabled!==false&&active?.canManageMembers)root.append(paymentsPanel([...(bookings.upcoming||[]),...(bookings.past||[])]));}
    function paymentsPanel(bookings){
      const panel=document.createElement('section');panel.className='panel';panel.style.marginTop='16px';panel.append(Object.assign(document.createElement('h2'),{textContent:'Recent payments and refunds'}));
      const locationId=active.saunaId;
      const paid=bookings.filter(b=>b.paymentIntentId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,20);
      if(!paid.length)panel.append(Object.assign(document.createElement('p'),{textContent:'Paid bookings will appear here.'}));
      for(const booking of paid){
        const row=document.createElement('div');row.className='booking';const text=document.createElement('div');set(text,`${booking.customerName||'Guest'} · ${booking.date} ${booking.startTime} · ${euro(booking.price)} · ${booking.refundStatus?'Refund '+booking.refundStatus:booking.status}`);row.append(text);
        if(booking.status==='confirmed'&&!['pending','succeeded'].includes(booking.refundStatus)){const button=document.createElement('button');set(button,booking.refundedAmount?'Refund remaining':'Full refund');button.addEventListener('click',async()=>{
          if(!window.confirm(`Refund ${euro(booking.price-booking.refundedAmount)} to ${booking.customerName||'this guest'} for ${booking.date} at ${booking.startTime}? This requests a full refund and cancels the booking after the refund succeeds.`))return;
          button.disabled=true;try{const result=await api(`/api/business/${encodeURIComponent(locationId)}/bookings/${encodeURIComponent(booking.id)}/refund`,{method:'POST',body:'{}'});if(!result.ok)throw new Error(result.body?.error||'Could not refund');set(text,`Refund ${result.body.status} · ${euro(booking.price)} · ${booking.customerName||'Guest'}`);set(button,'Refund requested');if(active?.saunaId===locationId)notice(result.body.status==='succeeded'?'Refund succeeded. The booking is cancelled.':'Refund is pending. Refresh to check its progress.');}catch(error){set(text,error.message);button.disabled=false;}
        });row.append(button);}panel.append(row);
      }return panel;
    }
    function bookingsPanel(bookings){const panel=document.createElement('section');panel.className='panel';const h=document.createElement('h2');set(h,'Upcoming bookings');panel.append(h);if(!bookings.length){const p=document.createElement('p');p.className='empty';set(p,'No upcoming bookings yet.');panel.append(p);return panel;}for(const booking of bookings.slice(0,12)){const row=document.createElement('div');row.className='booking';const left=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div');name.className='name';meta.className='meta';set(name,booking.customerName||'Guest');set(meta,`${booking.date||''} · ${booking.startTime||''}${booking.endTime?`–${booking.endTime}`:''}${booking.customerEmail?` · ${booking.customerEmail}`:''}`);left.append(name,meta);const right=document.createElement('div'),status=document.createElement('div'),amount=document.createElement('div');status.className=`status ${booking.status||''}`;amount.className='meta';set(status,booking.status||'pending');set(amount,euro(booking.price));right.append(status,amount);row.append(left,right);panel.append(row);}return panel;}
    function analyticsPanel(analytics,ok){const panel=document.createElement('section');panel.className='panel';const h=document.createElement('h2');set(h,'Demand insights');panel.append(h);if(!ok||analytics?.locked){const p=document.createElement('p');p.className='muted';set(p,'Detailed demand analytics are available on Premium and Enterprise. Your bookings remain visible here.');panel.append(p);return panel;}const rev=metric('Confirmed revenue (30 days)',new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(analytics.revenueEuros||0));rev.style.marginBottom='14px';panel.append(rev);const list=document.createElement('ul');list.className='list';const slots=analytics.slotBreakdown||[];if(!slots.length){const li=document.createElement('li');set(li,'No booking pattern is available yet.');list.append(li);}else for(const item of slots){const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('strong');set(a,item.slot);set(b,`${item.count} bookings`);li.append(a,b);list.append(li);}panel.append(list);return panel;}
    $('location-picker').addEventListener('change',e=>loadWorkspace(e.target.value));$('signout').addEventListener('click',async()=>{await clerk.signOut();location.reload()});$('add-location').addEventListener('click',()=>{location.href='/portal/onboard.html#setup'});boot();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>seána — Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<!--
  Admin portal.

  Authentication is Clerk. There is no password field on this page and no shared
  admin key. The previous version signed in against ADMIN_USERNAME/ADMIN_PASSWORD
  — defaulting to admin / seana-admin-2024 — and then stored ADMIN_API_KEY, the
  single bearer token every administrator shared, in sessionStorage.

  Authority now comes from a platform_admins row checked by the server on every
  request, so revoking someone takes effect immediately and each action is
  attributable to a person in the audit log.
-->
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0F1114;--card:#1A1D23;--border:rgba(200,120,90,0.15);
    --orange:#C8785A;--red:#E05A5A;--amber:#D4A853;--green:#6BBF7B;
    --text:#F0ECE6;--text2:rgba(240,236,230,0.6);--text3:rgba(240,236,230,0.35);
  }
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:15px}
  .centre{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px}
  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px;font-size:24px;font-weight:800}
  .topbar{border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}
  .topbar-logo{font-size:17px;font-weight:800}
  .role{background:var(--orange);color:#0F1114;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
  .main{padding:24px;max-width:1100px;margin:0 auto}
  h1{font-size:22px;font-weight:800;margin-bottom:4px}
  .sub{font-size:14px;color:var(--text2);margin-bottom:24px}
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:7px 15px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;font-family:inherit}
  .tab.active{background:var(--orange);border-color:var(--orange);color:#0F1114}
  .row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:12px}
  .row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .row-title{font-size:16px;font-weight:700}
  .row-meta{font-size:13px;color:var(--text2);margin-top:3px;word-break:break-word}
  .pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .p-pending{background:rgba(212,168,83,.15);color:var(--amber)}
  .p-approved{background:rgba(107,191,123,.15);color:var(--green)}
  .p-rejected,.p-deny{background:rgba(224,90,90,.15);color:var(--red)}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button.act{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none}
  .ap{background:var(--green);color:#0F1114}
  .rj{background:var(--red);color:#fff}
  .ghost{background:none;border:1px solid var(--border);color:var(--text2)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .empty{text-align:center;padding:50px 20px;color:var(--text3)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  th{text-align:left;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .warn{background:rgba(224,90,90,.1);border:1px solid rgba(224,90,90,.3);color:#ffb3b3;padding:14px 16px;border-radius:10px;margin-bottom:20px;font-size:14px;line-height:1.5}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:sp .7s linear infinite;margin:50px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:600px){.main{padding:14px}.topbar{padding:0 12px}}

/* Clerk defaults to a fixed-width card; keep embedded sign-in within phones. */
#signin{min-width:0;grid-template-columns:minmax(0,1fr)}
#signin>.card{min-width:0;width:100%;max-width:480px;justify-self:center}
#clerk-signin{min-width:0;width:100%}
#clerk-signin .cl-rootBox,#clerk-signin .cl-cardBox,#clerk-signin .cl-card{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
@media(max-width:480px){#signin{padding:16px}#signin>.card{padding:16px}#clerk-signin .cl-card{padding:20px 16px}}
</style>
<link rel="icon" type="image/png" sizes="128x128" href="/portal/favicon.png?v=3"><link rel="icon" type="image/svg+xml" href="/portal/favicon.svg?v=3"></head>
<body>

<div id="loading" class="centre"><div class="spin"></div></div>

<div id="signin" class="centre" style="display:none">
  <div class="card" style="max-width:440px;width:100%">
    <div class="logo">seána</div>
    <p style="font-size:18px;font-weight:700;margin-bottom:6px">Admin</p>
    <p style="color:var(--text2);font-size:14px;margin-bottom:24px">
      Sign in with your approved seána administrator account.
    </p>
    <div id="clerk-signin"></div>
  </div>
</div>

<div id="denied" class="centre" style="display:none">
  <div class="card" style="max-width:460px">
    <div class="logo">seána</div>
    <p id="denied-title" style="font-size:18px;font-weight:700;margin-bottom:10px"></p>
    <p id="denied-body" style="color:var(--text2);font-size:14px;line-height:1.6;margin-bottom:22px"></p>
    <button class="act" onclick="location.reload()">Try again</button>
    <button class="act ghost" onclick="signOut()">Use another account</button>
  </div>
</div>

<div id="dash" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">seána admin</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="role" id="who"></span>
      <button class="act ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="main">
    <h1>Platform administration</h1>
    <p class="sub" id="subtitle"></p>
    <div class="tabs">
      <button class="tab active" data-view="directory">All saunas</button>
      <button class="tab" data-view="photos">Photo review</button>
      <button class="tab" data-view="claims">Ownership claims</button>
      <button class="tab" data-view="listings">Sauna review</button>
      <button class="tab" data-view="onboarding">Owner onboarding</button>
      <button class="tab" data-view="customers">Customer signups</button>
      <button class="tab" data-view="owners">Owner signups</button>
      <button class="tab" data-view="orgs">Organisations</button>
      <button class="tab" data-view="security">Security</button>
    </div>
    <div id="content"><div class="spin"></div></div>
  </div>
</div>

<script src="/portal/clerk-loader.js"></script>
<script>
/*
 * This page is served both from the API host and from GitHub Pages, so the API
 * base is resolved rather than hardcoded, and the Clerk publishable key is
 * fetched from the server. The key is public by design — every authorisation
 * decision happens server side against platform_admins.
 */
const API_URL = /(^localhost$|^127\.|railway\.app$)/.test(location.hostname)
  ? ''
  : 'https://saunaapp-production.up.railway.app';

let clerk = null;
let me = null;
let view = 'directory';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

// Listing websites are entered by third parties. Keep them usable for admins
// without allowing a stored javascript:, data:, or malformed URL to run here.
function safeExternalHref(value) {
  try {
    const parsed = new URL(String(value));
    return ['https:', 'http:'].includes(parsed.protocol) ? parsed.href : '#';
  } catch {
    return '#';
  }
}

function show(id) {
  for (const x of ['loading','signin','denied','dash']) {
    $(x).style.display = x === id ? (x === 'dash' ? 'block' : 'flex') : 'none';
  }
}

function fail(title, body) {
  $('denied-title').textContent = title;
  $('denied-body').textContent = body;
  show('denied');
}

let authGeneration = 0;
let observedSession;
async function timedFetch(url, options = {}) {
  return fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
}
async function showSession(session) {
  clearReviewPreviews();
  const generation = ++authGeneration;
  me = null;
  $('content').replaceChildren();
  if (!session || session.status !== 'active') {
    show('signin');
    clerk.mountSignIn($('clerk-signin'), { forceRedirectUrl: location.origin + location.pathname });
    return;
  }
  show('loading');
  try {
    const res = await api('/api/admin/me');
    if (generation !== authGeneration) return;
    if (!res.ok) {
      if (res.status === 401) return fail('Sign-in could not be verified', 'Try again, or sign out and use your approved administrator account. Your session may have expired.');
      if (res.status === 403 && res.body?.code === 'mfa_required') return fail('Two-factor authentication required', 'Your account requires a second factor. Complete it in your account security settings.');
      if (res.status >= 500) return fail('Admin service temporarily unavailable', 'Your sign-in succeeded, but the server could not verify access. Please try again.');
      return fail('No admin access', 'This account is not the approved platform administrator. Use your nominated administrator account.');
    }
    me = res.body;
    $('who').textContent = me.role;
    $('subtitle').textContent = `Signed in as ${me.email}. Every action here is recorded against your account.`;
    show('dash');
    await render();
  } catch (error) {
    if (generation === authGeneration) fail('Could not connect to the admin service', 'Check your connection and try again. Your permissions have not changed.');
  }
}
async function boot() {
  let config;
  try {
    const response = await timedFetch(`${API_URL}/api/public-config`, { cache: 'no-store' });
    if (!response.ok) throw new Error('Configuration unavailable');
    config = await response.json();
  } catch {
    return fail('Server unreachable', 'Could not reach the seána API. Try again shortly.');
  }
  if (!config.clerkPublishableKey) return fail('Sign-in temporarily unavailable', 'Please try again shortly.');
  clerk = await window.SeanaAuth.load(config.clerkPublishableKey);
  // Static pages must respond when Clerk completes sign-in without a page reload.
  clerk.addListener(({ session }) => {
    const key = session ? session.id + ':' + session.status : 'signed-out';
    if (key === observedSession) return;
    observedSession = key;
    showSession(session).catch(() => fail('Sign-in could not complete', 'Please reload and try again.'));
  });
  const key = clerk.session ? clerk.session.id + ':' + clerk.session.status : 'signed-out';
  if (key !== observedSession) {
    observedSession = key;
    await showSession(clerk.session);
  }
}

async function signOut() {
  if (clerk) await clerk.signOut();
  location.reload();
}

/** Every request carries a fresh, short-lived Clerk session token. */
async function api(path, options = {}) {
  const token = await clerk.session?.getToken();
  const res = await timedFetch(`${API_URL}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  let body = null;
  try { body = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, body };
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    render();
  };
});

const reviewPreviewUrls = new Set();
function clearReviewPreviews(){for(const url of reviewPreviewUrls)URL.revokeObjectURL(url);reviewPreviewUrls.clear();}
async function render() {
  clearReviewPreviews();
  $('content').innerHTML = '<div class="spin"></div>';
  try {
    if (view === 'customers' || view === 'owners') return await renderRegistrations();
    if (view === 'photos') return await renderPhotos();
    if (view === 'directory') return await renderDirectory();
    if (view === 'claims')   return await renderClaims();
    if (view === 'listings') return await renderListings();
    if (view === 'onboarding') return await renderOnboarding();
    if (view === 'orgs')     return await renderOrgs();
    if (view === 'security') return await renderSecurity();
  } catch (err) {
    $('content').innerHTML = `<p class="empty">Could not load: ${esc(err.message)}</p>`;
  }
}

async function renderRegistrations(offset=0) {
  const selected=view,type=selected==='customers'?'customer':'owner';
  const result=await api('/api/admin/registrations?type='+type+'&offset='+offset);
  if(!result.ok)throw new Error(result.body?.error || 'Could not load signups');
  if(view!==selected)return;
  $('content').innerHTML=`<h2>${type==='customer'?'Customer':'Sauna owner'} signups</h2><p>${type==='customer'?'One account for the website and app.':'Owner signup records are separate from customer signups. Listing access still requires verification.'}</p><div style="overflow:auto"><table><thead><tr><th>Email</th><th>Joined through</th><th>Joined</th></tr></thead><tbody>${result.body.registrations.map(r=>`<tr><td>${esc(r.email)}</td><td>${esc(r.signup_source)}</td><td>${esc(new Date(r.created_at).toLocaleDateString('en-IE'))}</td></tr>`).join('') || '<tr><td colspan="3">No signups yet.</td></tr>'}</tbody></table></div><div id="signup-pages"></div>`;
  for(const [label,page] of [['Previous',offset>0?Math.max(0,offset-100):null],['Next',result.body.nextOffset]]){if(page===null)continue;const button=document.createElement('button');button.textContent=label;button.onclick=()=>renderRegistrations(page).catch(e=>{$('content').textContent=e.message;});$('signup-pages').append(button);}
}

async function renderOnboarding(offset = 0) {
  const result = await api('/api/admin/onboarding?offset=' + offset);
  if (!result.ok) throw new Error(result.body?.error || 'Could not load onboarding');
  if (view !== 'onboarding') return;
  const rows = result.body.organizations;
  $('content').innerHTML = `<h2>Help owners reach their first booking</h2><p>Oldest unfinished setups appear first. Use the review queues below to accept or reject owner submissions. A saved step is progress, not proof of booking readiness.</p><div class="actions"><button class="act" onclick="document.querySelector('[data-view=listings]').click()">Review new saunas</button><button class="act" onclick="document.querySelector('[data-view=claims]').click()">Review ownership claims</button><button class="act" onclick="render()">Refresh submissions</button></div><label>Filter this page<input id="onboarding-search" type="search" placeholder="Business name or email"></label><div style="overflow:auto"><table><thead><tr><th>Business</th><th>Contact</th><th>Progress / source</th><th>Locations / verified</th><th>Pending claims</th><th>Last setup activity</th></tr></thead><tbody id="onboarding-rows"></tbody></table></div><div id="onboarding-pages"></div>`;
  const draw = () => { const q = $('onboarding-search').value.toLowerCase(); $('onboarding-rows').innerHTML = rows.filter(o => `${o.name} ${o.billing_email}`.toLowerCase().includes(q)).map(o => `<tr><td>${esc(o.name)}<br>${esc(o.status)}</td><td>${esc(o.billing_email || '—')}</td><td>${esc(o.completed_at ? 'Setup completed' : o.step)}<br>${esc(o.source)}</td><td>${esc(o.locations)} / ${esc(o.verified_locations)}</td><td>${esc(o.pending_claims)}</td><td>${esc(new Date(o.updated_at || o.created_at).toLocaleDateString('en-IE'))}</td></tr>`).join('') || '<tr><td colspan="6">No matching businesses</td></tr>'; }; $('onboarding-search').addEventListener('input', draw); draw();
  for (const [label, next] of [['Previous', offset > 0 ? Math.max(0, offset - 100) : null], ['Next', result.body.nextOffset]]) { if (next === null) continue; const b = document.createElement('button'); b.textContent = label; b.onclick = () => renderOnboarding(next).catch(e => { $('content').textContent = e.message; }); $('onboarding-pages').append(b); }
}

async function renderPhotos(){
  const response=await api('/api/admin/photos');if(!response.ok)throw new Error(response.body?.error||'Could not load photo queue');if(view!=='photos')return;
  const root=$('content');root.replaceChildren();const note=document.createElement('p');note.textContent='Owner uploads stay private until you approve them. Open each photo and check it represents the venue before publishing. Showing up to 100 pending photos.';root.append(note);
  const photos=response.body.photos||[];if(!photos.length){const empty=document.createElement('p');empty.textContent='No photos waiting for review.';root.append(empty);}
  for(const photo of photos){
    const card=document.createElement('section');card.className='row';const title=document.createElement('h2');title.textContent=photo.sauna_name||photo.sauna_id;const status=document.createElement('p');status.textContent='Pending review · '+new Date(photo.created_at).toLocaleDateString('en-IE');
    const image=document.createElement('img');image.alt='Owner-submitted venue photo awaiting approval';image.style.cssText='max-width:100%;width:480px;max-height:420px;object-fit:contain';image.hidden=true;
    const preview=document.createElement('button');preview.className='act';preview.textContent='View photo';const approve=document.createElement('button');approve.className='act ap';approve.textContent='Approve and publish';approve.disabled=true;const reject=document.createElement('button');reject.className='act rj';reject.textContent='Reject';
    preview.onclick=async()=>{preview.disabled=true;try{const token=await clerk.session?.getToken();const response=await timedFetch(`${API_URL}/api/admin/photos/${encodeURIComponent(photo.id)}/preview`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});if(!response.ok)throw new Error('Preview unavailable');const blob=await response.blob();if(!card.isConnected)return;const url=URL.createObjectURL(blob);reviewPreviewUrls.add(url);image.src=url;image.hidden=false;approve.disabled=false;}catch(error){status.textContent=error.message;preview.disabled=false;}};
    const review=async decision=>{let reason='';if(decision==='rejected'){reason=prompt('Why is this photo unsuitable? This reason is shown to the owner.');if(!reason?.trim())return;}else if(!confirm('Publish this photo in the customer app?'))return;
      approve.disabled=true;reject.disabled=true;try{const result=await api(`/api/admin/photos/${encodeURIComponent(photo.id)}/review`,{method:'POST',body:JSON.stringify({status:decision,reason})});if(!result.ok)throw new Error(result.body?.error||'Could not review photo');if(view==='photos')await render();}catch(error){status.textContent=error.message;approve.disabled=image.hidden;reject.disabled=false;}};
    approve.onclick=()=>review('approved');reject.onclick=()=>review('rejected');card.append(title,status,image,preview,approve,reject);root.append(card);
  }
}

async function renderDirectory() {
  const [directory, overview] = await Promise.all([api('/api/admin/saunas-list'), api('/api/admin/overview')]);
  if (!directory.ok) throw new Error(directory.body?.error || 'Could not load saunas');
  if (view !== 'directory') return;
  const accounts = new Map((overview.body?.accounts || []).map(a => [a.saunaId, a]));
  const rows = directory.body.saunas || [];
  $('content').innerHTML = `<p>${rows.length} saunas · ${overview.ok ? accounts.size + ' business accounts' : 'Business metrics temporarily unavailable'}</p>
    <label>Search name or county <input id="directory-search" type="search" maxlength="160" placeholder="Search all saunas"></label>
    <p id="directory-count"></p><div style="overflow:auto"><table><thead><tr><th>Sauna</th><th>County</th><th>Online payments</th><th>Confirmed bookings</th><th>Revenue</th><th>Website</th></tr></thead><tbody id="directory-rows"></tbody></table></div>`;
  const draw = () => {
    const query = $('directory-search').value.trim().toLowerCase();
    const visible = rows.filter(s => `${s.name} ${s.county || ''}`.toLowerCase().includes(query));
    $('directory-count').textContent = `${visible.length} locations`;
    $('directory-rows').innerHTML = visible.map(s => {
      const a = accounts.get(s.id);
      return `<tr><td>${esc(s.name)}</td><td>${esc(s.county || '—')}</td><td>${overview.ok ? (a?.stripeConnected ? 'Ready' : 'Not connected') : 'Unknown'}</td><td>${overview.ok ? esc(a?.bookings?.confirmed || 0) : '—'}</td><td>${overview.ok ? esc(a?.bookings?.revenue || '€0.00') : '—'}</td><td>${s.website ? `<a href="${esc(safeExternalHref(s.website))}" target="_blank" rel="noopener noreferrer">Website</a>` : '—'}</td></tr>`;
    }).join('');
  };
  $('directory-search').addEventListener('input', draw); draw();
}

// ─── Ownership claims ────────────────────────────────────────────────────────

async function renderClaims() {
  const { body } = await api('/api/admin/claims?status=pending');
  const claims = body?.claims || [];

  if (claims.length === 0) {
    $('content').innerHTML = '<p class="empty">No claims waiting for review.</p>';
    return;
  }

  const canAct = me.permissions.canApproveListings;

  $('content').innerHTML = `
    <div class="warn">
      Approving a claim gives that business access to this listing's bookings,
      including customer names and email addresses. Confirm the claimant really
      operates the venue before approving.
    </div>
    ${claims.map(c => `
      <div class="row">
        <div class="row-head">
          <div>
            <div class="row-title">${esc(c.saunaName)}</div>
            <div class="row-meta">
              Claimed by ${esc(c.claimantEmail)} &middot; ${esc(String(c.method).replace(/_/g, ' '))}
              ${c.county ? ' &middot; ' + esc(c.county) : ''}
            </div>
            ${c.website ? `<div class="row-meta">Listing website:
              <a href="${esc(safeExternalHref(c.website))}" target="_blank" rel="noopener noreferrer"
                 style="color:var(--orange)">${esc(c.website)}</a></div>` : ''}
            ${c.evidence && Object.keys(c.evidence).length
              ? `<div class="row-meta">Evidence: ${esc(JSON.stringify(c.evidence))}</div>` : ''}
          </div>
          <span class="pill p-pending">${esc(c.status)}</span>
        </div>
        <div class="actions">
          <button class="act ap" onclick="approveClaim('${esc(c.id)}')" ${canAct ? '' : 'disabled'}>Approve</button>
          <button class="act rj" onclick="rejectClaim('${esc(c.id)}')" ${canAct ? '' : 'disabled'}>Reject</button>
          ${canAct ? '' : '<span style="color:var(--text3);font-size:12px;align-self:center">Requires the admin role</span>'}
        </div>
      </div>
    `).join('')}
  `;
}

async function approveClaim(id) {
  if (!confirm('Approve this claim?\n\nThe claimant will gain access to this listing’s bookings and customer data.')) return;
  const res = await api(`/api/admin/claims/${id}/approve`, { method: 'POST' });
  if (res.ok) render();
  else alert(res.body?.error || 'Could not approve the claim');
}

async function rejectClaim(id) {
  const reason = prompt('Reason (shown to the claimant, optional):');
  if (reason === null) return;
  const res = await api(`/api/admin/claims/${id}/reject`, {
    method: 'POST', body: JSON.stringify({ reason }),
  });
  if (res.ok) render();
  else alert(res.body?.error || 'Could not reject the claim');
}

// ─── Listings ────────────────────────────────────────────────────────────────

async function renderListings() {
  const response = await api('/api/admin/submissions');
  if(!response.ok)throw new Error(response.body?.error || 'Could not load sauna submissions');
  if(view!=='listings')return;
  const body=response.body;
  const listings = (body?.listings || [])
    .sort((a, b) => Number(['pending','info_requested'].includes(b.status))-Number(['pending','info_requested'].includes(a.status)) || new Date(b.submittedAt) - new Date(a.submittedAt));

  if (listings.length === 0) {
    $('content').innerHTML = '<p class="empty">No submissions.</p>';
    return;
  }

  const canAct = me.permissions.canApproveListings;

  $('content').innerHTML = listings.map(l => {
    const d = l.data || {};
    const status = l.status || 'pending';
    return `
      <div class="row">
        <div class="row-head">
          <div>
            <div class="row-title">${esc(d.name || l.saunaId || 'Untitled')}</div>
            <div class="row-meta">
              ${esc(d.county || '—')} &middot; ${esc(l.contactEmail || 'no contact email')}
              &middot; ${l.submittedAt ? new Date(l.submittedAt).toLocaleDateString('en-IE') : '—'}
            </div>
          </div>
          <span class="pill p-${esc(status)}">${esc(status)}</span>
        </div>
        <p>${esc(d.description || 'No description provided')}</p><p><strong>Applicant:</strong> ${esc(l.contactName || "Not supplied")} · ${esc(l.contactPhone || d.phone || "No phone")}</p><p><strong>Map pin:</strong> ${esc(d.lat ?? "Not supplied")}, ${esc(d.lng ?? "Not supplied")}</p><p><strong>Address:</strong> ${esc(d.location || 'Missing')} · ${esc(d.county || 'Missing')}</p><p><strong>Business contact:</strong> ${esc(d.phone || 'No phone')} · ${esc(d.website || 'No website')}</p><p><strong>Opening hours:</strong> ${esc(d.opening_hours || 'Missing')}</p><p><strong>Session:</strong> €${esc(d.session_price ?? 'Not set')} · ${esc(d.max_capacity ?? 'Not set')} people</p><p><strong>Rules:</strong> ${esc(d.sauna_rules || 'Not provided')}</p><p><strong>Booking terms:</strong> ${esc(d.terms_conditions || 'Not provided')}</p>
        ${['pending','info_requested'].includes(status) ? `
          <p>Approval unlocks the owner dashboard. The sauna stays private until the owner completes all launch requirements. Check the venue and contact the business independently before granting access.</p>
          <label><input type="checkbox" id="real-${esc(l.listingId)}"> I checked that this is a real sauna at the stated location.</label><br>
          <label><input type="checkbox" id="owner-${esc(l.listingId)}"> I verified that the submitter is authorised to manage it.</label>
          <p class="row-meta">${d.reviewNotificationSentAt ? 'Review notification sent' : 'Review notification queued — email configuration and background worker required'}</p>
          <div class="actions">
            <button class="act ap" onclick="approveListing('${esc(l.listingId)}')" ${canAct ? '' : 'disabled'}>Approve sauna</button>
            <button class="act rj" onclick="rejectListing('${esc(l.listingId)}')" ${canAct ? '' : 'disabled'}>Reject</button>
          </div>` : ''}
      </div>`;
  }).join('');
}

async function approveListing(id) {
  const verifiedRealSauna = document.getElementById('real-' + id)?.checked === true;
  const verifiedOwnership = document.getElementById('owner-' + id)?.checked === true;
  if (!verifiedRealSauna || !verifiedOwnership) return alert('Complete both verification checks before approving this sauna.');
  const res = await api(`/api/listings/${id}/approve`, { method: 'POST', body: JSON.stringify({verifiedRealSauna, verifiedOwnership}) });
  if (res.ok) render(); else alert(res.body?.error || 'Could not approve');
}

async function rejectListing(id) {
  const reason = prompt('Reason (optional):');
  if (reason === null) return;
  const res = await api(`/api/listings/${id}/reject`, {
    method: 'POST', body: JSON.stringify({ reason }),
  });
  if (res.ok) render(); else alert(res.body?.error || 'Could not reject');
}

// ─── Organisations ───────────────────────────────────────────────────────────

async function renderOrgs() {
  const { body } = await api('/api/admin/organizations');
  const orgs = body?.organizations || [];

  if (orgs.length === 0) {
    $('content').innerHTML = '<p class="empty">No organisations yet.</p>';
    return;
  }

  $('content').innerHTML = `
    <div class="row"><div class="scroll">
      <table>
        <thead><tr>
          <th>Organisation</th><th>Locations</th><th>Members</th>
          <th>Onboarding</th><th>Status</th>
        </tr></thead>
        <tbody>${orgs.map(o => `
          <tr>
            <td style="color:var(--text)">${esc(o.name)}<br>
              <span style="color:var(--text3);font-size:12px">${esc(o.billing_email || '')}</span></td>
            <td>${o.location_count}</td>
            <td>${o.member_count}</td>
            <td>${esc(o.onboarding_state)}</td>
            <td>${esc(o.status)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div></div>`;
}

// ─── Security ────────────────────────────────────────────────────────────────

async function renderSecurity() {
  const { body } = await api('/api/admin/security-events');
  const entries = body?.entries || [];
  const summary = body?.summary || [];

  $('content').innerHTML = `
    ${summary.length ? `
      <div class="row">
        <div class="row-title" style="margin-bottom:12px">Most denied access attempts</div>
        <div class="scroll"><table>
          <thead><tr><th>Actor</th><th>Denied attempts</th></tr></thead>
          <tbody>${summary.map(s => `
            <tr><td class="mono">${esc(s.actor)}</td><td>${s.deniedAttempts}</td></tr>`).join('')}
          </tbody>
        </table></div>
      </div>` : ''}

    <div class="row">
      <div class="row-title" style="margin-bottom:12px">Recent denials</div>
      ${entries.length === 0 ? '<p class="empty">Nothing denied recently.</p>' : `
        <div class="scroll"><table>
          <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Location</th><th>Detail</th></tr></thead>
          <tbody>${entries.slice(0, 100).map(e => `
            <tr>
              <td>${new Date(e.ts).toLocaleString('en-IE')}</td>
              <td class="mono">${esc(e.actor_email || e.actor_id || e.ip || '—')}</td>
              <td><span class="pill p-deny">${esc(e.action)}</span></td>
              <td class="mono">${esc(e.sauna_id || '—')}</td>
              <td class="mono">${esc(JSON.stringify(e.metadata || {}).slice(0, 120))}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>`}
    </div>`;
}

boot().catch(err => fail('Something went wrong', err.message));
</script>
